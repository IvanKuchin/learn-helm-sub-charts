name: Release Compatibility Matrix

on:
  workflow_dispatch:

jobs:
  comp-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v7

      - name: Fetch Latest Microservice Tags
        id: fetch-tags
        run: |
          DB_REPO=$(yq eval '.db.image.repository' umbrella/values.yaml)
          API_REPO=$(yq eval '.api.image.repository' umbrella/values.yaml)
          OPENAPI_REPO=$(yq eval '.openapi.image.repository' umbrella/values.yaml)
          FRONTEND_REPO=$(yq eval '.frontend.image.repository' umbrella/values.yaml)

          # cut the repository name from the full path (e.g., gcr.io/ivankuchin/test-container -> ivankuchin/test-container)
          DB_REPO=${DB_REPO#*/}
          API_REPO=${API_REPO#*/}
          OPENAPI_REPO=${OPENAPI_REPO#*/}
          FRONTEND_REPO=${FRONTEND_REPO#*/}

          DB_TAG=$(gh api repos/$DB_REPO/tags --jq '.[].name' | sort -V | tail -n 1)
          API_TAG=$(gh api repos/$API_REPO/tags --jq '.[].name' | sort -V | tail -n 1)
          OPENAPI_TAG=$(gh api repos/$OPENAPI_REPO/tags --jq '.[].name' | sort -V | tail -n 1)
          FRONTEND_TAG=$(gh api repos/$FRONTEND_REPO/tags --jq '.[].name' | sort -V | tail -n 1)

          echo "db_tag=$DB_TAG" >> $GITHUB_OUTPUT
          echo "api_tag=$API_TAG" >> $GITHUB_OUTPUT
          echo "openapi_tag=$OPENAPI_TAG" >> $GITHUB_OUTPUT
          echo "frontend_tag=$FRONTEND_TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update umbrella/values.yaml with New Microservice Versions
        env:
          NEW_DB: ${{ steps.fetch-tags.outputs.db_tag }}
          NEW_API: ${{ steps.fetch-tags.outputs.api_tag }}
          NEW_OPENAPI: ${{ steps.fetch-tags.outputs.openapi_tag }}
          NEW_FRONTEND: ${{ steps.fetch-tags.outputs.frontend_tag }}
        run: |
          VALUES_FILE="umbrella/values.yaml"
          
          CURRENT_DB=$(yq eval '.db.image.tag' $VALUES_FILE)
          CURRENT_API=$(yq eval '.api.image.tag' $VALUES_FILE)
          CURRENT_OPENAPI=$(yq eval '.openapi.image.tag' $VALUES_FILE)
          CURRENT_FRONTEND=$(yq eval '.frontend.image.tag' $VALUES_FILE)

          echo "DB: $CURRENT_DB -> $NEW_DB"
          echo "API: $CURRENT_API -> $NEW_API"
          echo "OpenAPI: $CURRENT_OPENAPI -> $NEW_OPENAPI"
          echo "Frontend: $CURRENT_FRONTEND -> $NEW_FRONTEND"

          # Update values.yaml atomically
          yq eval -i ".db.image.tag = \"$NEW_DB\"" $VALUES_FILE
          yq eval -i ".api.image.tag = \"$NEW_API\"" $VALUES_FILE
          yq eval -i ".openapi.image.tag = \"$NEW_OPENAPI\"" $VALUES_FILE
          yq eval -i ".frontend.image.tag = \"$NEW_FRONTEND\"" $VALUES_FILE

          # 5. Commit and push atomically
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $VALUES_FILE
          git commit -m "chore(matrix): release microservice versions (db: $NEW_DB, api: $NEW_API, openapi: $NEW_OPENAPI, frontend: $NEW_FRONTEND)"
          git push origin master

